name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  c4:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/c4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/c4/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm run build

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  viewer-e2e:
    runs-on: ubuntu-latest
    # 通常は1分前後。apt の配布先に届かないときに、10分も待たない。
    timeout-minutes: 8
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      # apt の配布先に届かないとき(名前解決の一時的な障害など)、早く失敗させる。
      # 既定のままだと、取得を何度も待って10分かかった。
      - name: apt の取得に上限を付ける
        run: |
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/99fail-fast
        working-directory: .
      # ブラウザは node_modules の中に入れる(グローバルに入れない)。
      - run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium
      - run: npm run e2e
      # 失敗したとき、スクリーンショットの差分画像を確認できるようにする。
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: viewer/test-results
          retention-days: 7
