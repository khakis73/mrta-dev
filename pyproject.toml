[project]
name = "mrta"
version = "0.0.1"
description = "異種ロボット(AMR + モバイルマニピュレーター)のタスク割当ソルバ比較シミュレータ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ortools>=9.15.6755",
]

[project.scripts]
mrta = "mrta.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "jsonschema>=4.26.0",
    "mypy>=1.13",
    "nodeenv>=1.12.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mrta"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# ortools.constraint_solver(Routing)は型情報(py.typed)を持たない。ortools.sat は持つので対象外。
[[tool.mypy.overrides]]
module = ["ortools.constraint_solver", "ortools.constraint_solver.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # OR-Tools(SWIG)の import 時の警告。こちらでは直せない。
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
